name: build-keepalived

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          docker build -t smoke ./keepalived
          docker run --rm --cap-add NET_ADMIN --cap-add NET_BROADCAST --cap-add NET_RAW \
            -e VIP=192.0.2.53/24 -e INTERFACE=eth0 -e SRC_IP=172.17.0.2 \
            -e PEER_IPS=192.0.2.2 -e AUTH_PASS=testpass --entrypoint sh smoke \
            -c 'timeout 5 /usr/local/bin/entrypoint.sh; rc=$?; test $rc -eq 0 -o $rc -eq 124'
          ! docker run --rm -e VIP=x --entrypoint /usr/local/bin/entrypoint.sh smoke
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pihole-ha-keepalived
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./keepalived
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
